services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override Redis URL to use the docker-compose redis service
      # Comment this out if you use a CLOUD Redis (like your Redis Cloud instance)
      # REDIS_URL: redis://redis:6379/0
      
      # Force CPU-only inference
      CUDA_VISIBLE_DEVICES: ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    # Uncomment the redis dependency if you switch to local redis
    # depends_on:
    #   redis:
    #     condition: service_healthy

